<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANGEL INC. — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div id="loginScreen" class="screen"><div class="login-card"><img src="assets/angel-inc-logo.jpg" class="login-logo" alt="Angel Inc"><p class="eyebrow">ADMIN PORTAL</p><h1>Welcome back.</h1><p class="muted">Masuk untuk mengelola produk ANGEL INC.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="dark" type="submit">Sign in</button><p id="loginError" class="error"></p></form></div></div>
<div id="app" class="app hidden"><aside class="sidebar" id="sidebar"><div class="brand"><img src="assets/angel-inc-logo.jpg"><span>ADMIN</span></div><nav><button class="nav active" data-view="dashboard">Dashboard</button><button class="nav" data-view="products">Products</button></nav><button id="logout" class="logout">Sign out</button></aside><main class="main"><header class="topbar"><button id="menu" class="menu">☰</button><div><p class="eyebrow">ANGEL INC. / ADMIN</p><h2 id="title">Dashboard</h2></div><button id="refresh" class="outline">Refresh</button></header>
<section id="dashboardView" class="view"><div class="stats"><div class="stat"><span>Total products</span><strong id="total">—</strong></div><div class="stat"><span>Active</span><strong id="active">—</strong></div><div class="stat"><span>Low stock</span><strong id="low">—</strong></div></div><div class="panel"><div class="panel-head"><div><p class="eyebrow">OVERVIEW</p><h3>Recent products</h3></div><button class="dark small" id="dashAdd">Add product</button></div><div id="recent"></div></div></section>
<section id="productsView" class="view hidden"><div class="panel"><div class="panel-head"><div><p class="eyebrow">CATALOG</p><h3>Products</h3></div><button id="add" class="dark small">+ Add product</button></div><div class="toolbar"><input id="search" placeholder="Search product..."><select id="filter"><option value="">All categories</option><option>Parfume</option><option>Body Mist</option><option>Body Wash</option><option>Body Scrub</option><option>Baju</option><option>Jaket</option><option>Sepatu</option></select></div><div id="table"></div></div></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="panel-head"><div><p class="eyebrow">PRODUCT</p><h3 id="modalTitle">Add product</h3></div><button id="close" class="x">×</button></div><form id="productForm"><input id="id" type="hidden"><div class="form-grid"><label>Name<input id="name" required></label><label>Category<select id="category"><option>Parfume</option><option>Body Mist</option><option>Body Wash</option><option>Body Scrub</option><option>Baju</option><option>Jaket</option><option>Sepatu</option></select></label><label>Price<input id="price" type="number" min="0" required></label><label>Stock<input id="stock" type="number" min="0" required></label><label class="wide">Image URL<input id="image" type="url"></label><label class="wide">Description<textarea id="desc" rows="4"></textarea></label><label class="check"><input id="activeBox" type="checkbox" checked> Active — tampil di website pelanggan</label></div><p id="formError" class="error"></p><div class="modal-actions"><button type="button" id="cancel" class="outline">Cancel</button><button class="dark">Save product</button></div></form></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
